/* Pure game rules: direction 0=up, 1=right, 2=down, 3=left. */
var BeeGame = (function () {
  "use strict";
  function level(x, y, goalX, goalY, path) {
    return { columns: 5, rows: 5, start: { x: x, y: y, direction: 1 }, goal: { x: goalX, y: goalY }, path: path };
  }
  var levels = { easy: [], challenge: [] };
  var distance, route, i;
  for (distance = 1; distance <= 4; distance += 1) {
    route = [];
    for (i = 0; i <= distance; i += 1) { route.push({ x: i, y: 2 }); }
    levels.easy.push(level(0, 2, distance, 2, route));
  }
  levels.challenge = [
    level(0, 3, 1, 3, [{ x: 0, y: 3 }, { x: 1, y: 3 }]),
    level(1, 1, 2, 2, [{ x: 1, y: 1 }, { x: 2, y: 1 }, { x: 2, y: 2 }]),
    level(0, 3, 2, 2, [{ x: 0, y: 3 }, { x: 1, y: 3 }, { x: 2, y: 3 }, { x: 2, y: 2 }]),
    level(0, 1, 4, 2, [{ x: 0, y: 1 }, { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 2, y: 2 }, { x: 3, y: 2 }, { x: 4, y: 2 }])
  ];
  function outside(position, course) {
    return position.x < 0 || position.y < 0 || position.x >= course.columns || position.y >= course.rows;
  }
  function start(course) { return { x: course.start.x, y: course.start.y, direction: course.start.direction, outside: false }; }
  function step(position, command, course) {
    var next = { x: position.x, y: position.y, direction: position.direction, outside: false };
    var dx = [0, 1, 0, -1], dy = [-1, 0, 1, 0];
    if (command === "L") { next.direction = (next.direction + 3) % 4; }
    else if (command === "R") { next.direction = (next.direction + 1) % 4; }
    else if (command === "F") { next.x += dx[next.direction]; next.y += dy[next.direction]; }
    next.outside = outside(next, course);
    return next;
  }
  function outcome(position, course) {
    if (outside(position, course)) { return "outside"; }
    return position.x === course.goal.x && position.y === course.goal.y ? "success" : "retry";
  }
  return { levels: levels, maxCommands: 12, start: start, step: step, outcome: outcome };
}());
</script>

    for (i = 0; i < BeeGame.maxCommands; i += 1) {
      item = document.createElement("li"); item.className = "command-slot";
      if (i < commands.length) {
        button = document.createElement("button"); button.className = "command-chip" + (i === active ? " active" : (i < completed ? " finished" : ""));
        button.innerHTML = icon(commands[i]); button.setAttribute("data-index", String(i));
        button.setAttribute("aria-label", (i + 1) + "ばんめ " + labels[commands[i]] + "。タップでけす");
        if (i === active) { button.setAttribute("aria-current", "step"); }
        button.disabled = running || won; item.appendChild(button);
      } else { item.innerHTML = '<span class="empty-slot" aria-hidden="true">·</span>'; }
      list.appendChild(item);
    }
    byId("command-count").textContent = commands.length + " / " + BeeGame.maxCommands;
    updateButtons();
  }
  function updateButtons() {
    var i, locked = running || won;
    for (i = 0; i < inputs.length; i += 1) { byId(inputs[i]).disabled = locked; }
    byId("go").disabled = locked || commands.length === 0;
    byId("undo").disabled = locked || commands.length === 0;
    byId("forward").disabled = locked || commands.length >= BeeGame.maxCommands;
    byId("left").disabled = locked || commands.length >= BeeGame.maxCommands;
    byId("right").disabled = locked || commands.length >= BeeGame.maxCommands;
  }
  function stopTimer() { if (timer !== null) { window.clearTimeout(timer); timer = null; } }
  function loadLevel() {
    stopTimer(); running = false; won = false; active = -1; completed = 0; commands = [];
    byId("result").hidden = true;
    var current = course(), x, y, i, routeCell, cell, html = "";
    for (y = 0; y < current.rows; y += 1) {
      for (x = 0; x < current.columns; x += 1) {
        routeCell = false;
        for (i = 0; i < current.path.length; i += 1) { if (current.path[i].x === x && current.path[i].y === y) { routeCell = true; } }
        cell = "cell" + (routeCell ? " route" : "") + (x === current.start.x && y === current.start.y ? " start" : "");
        html += '<div class="' + cell + '" style="left:' + (x * 20) + '%;top:' + (y * 20) + '%"></div>';
      }
    }
    byId("cells").innerHTML = html;
    byId("flower").style.left = (current.goal.x * 20) + "%"; byId("flower").style.top = (current.goal.y * 20) + "%";
    byId("game").className = mode === "easy" ? "easy-mode" : "challenge-mode";
    byId("left").hidden = mode === "easy"; byId("right").hidden = mode === "easy";
    byId("mode-name").textContent = mode === "easy" ? "かんたん" : "チャレンジ";
    byId("level-text").textContent = (levelIndex + 1) + " / " + BeeGame.levels[mode].length;
    html = "";
    for (i = 0; i < BeeGame.levels[mode].length; i += 1) { html += '<span class="level-dot' + (i === levelIndex ? " current" : (i < levelIndex ? " done" : "")) + '"></span>'; }
    byId("dots").innerHTML = html;
    resetPosition(); renderProgram(); status("やじるしを おしてね");
  }
  function chooseMode(selected) { mode = selected; levelIndex = 0; byId("welcome").hidden = true; byId("game").hidden = false; loadLevel(); }
  function editReady() { active = -1; completed = 0; resetPosition(); status("ならべたら GO！"); }
  function add(command) {
    if (running || won || commands.length >= BeeGame.maxCommands || (mode === "easy" && command !== "F")) { return; }
    editReady(); commands.push(command); renderProgram();
    if (commands.length === BeeGame.maxCommands) { status("いっぱいだね。GOか、1つ けしてね"); }
  }
  function finish(result) {
    stopTimer(); running = false; active = -1;
    if (result === "success") {
      won = true; byId("bee").className = "bee happy";
      var last = levelIndex === BeeGame.levels[mode].length - 1;
      byId("result-title").textContent = last ? "ぜんぶ できた！" : "できたね！";
      byId("result-message").textContent = "おはなに ついたよ";
      byId("next").textContent = last ? "はじめから →" : "つぎへ →";
      byId("next").setAttribute("aria-label", last ? "さいしょのもんだいからあそぶ" : "つぎのもんだいへ");
      byId("result").hidden = false; status("できたね！ はちさんも うれしいね");
      byId("next").focus();
    } else { status(result === "outside" ? "おっと！ 1つ けして ためそう" : "あと すこし！ ならべなおして GO！", true); }
    renderProgram();
  }
  function execute(index) {
    if (!running) { return; }
    timer = null;
    if (index >= commands.length) { finish(BeeGame.outcome(position, course())); return; }
    active = index; renderProgram(); status((index + 1) + "ばんめ：" + labels[commands[index]]);
    var next = BeeGame.step(position, commands[index], course());
    if (next.outside) { timer = window.setTimeout(function () { finish("outside"); }, 650); return; }
    if (commands[index] === "L") { angle -= 90; }
    if (commands[index] === "R") { angle += 90; }
    position = next; placeBee(false);
    timer = window.setTimeout(function () { completed = index + 1; execute(index + 1); }, 700);
  }
  function go() {
    if (running || won || commands.length === 0) { return; }
    stopTimer(); resetPosition(); running = true; completed = 0; active = -1; renderProgram();
    /* Leave a frame at the starting square before the first animated move. */
    timer = window.setTimeout(function () { execute(0); }, 100);
  }
  /* A single click listener handles both a mouse click and the browser's touch click. */
  function onClick(id, callback) { byId(id).addEventListener("click", callback, false); }
  byId("brand-bee").innerHTML = beeArt; byId("welcome-bee").innerHTML = beeArt;
  byId("welcome-flower").innerHTML = flowerArt; byId("flower").innerHTML = flowerArt; byId("bee-direction").innerHTML = beeArt;
  byId("easy-icon").innerHTML = icon("F"); byId("challenge-icon").innerHTML = icon("R") + icon("F");
  byId("left-icon").innerHTML = icon("L"); byId("forward-icon").innerHTML = icon("F"); byId("right-icon").innerHTML = icon("R");
  byId("go-icon").innerHTML = icon("play"); byId("undo-icon").innerHTML = icon("undo"); byId("restart-icon").innerHTML = icon("reset");
  byId("back-icon").innerHTML = icon("back"); byId("note-arrow").innerHTML = icon("F"); byId("result-icon").innerHTML = beeArt;
  onClick("choose-easy", function () { chooseMode("easy"); }); onClick("choose-challenge", function () { chooseMode("challenge"); });
  onClick("forward", function () { add("F"); }); onClick("left", function () { add("L"); }); onClick("right", function () { add("R"); }); onClick("go", go);
  onClick("undo", function () { if (!running && !won && commands.length) { editReady(); commands.pop(); renderProgram(); } });
  onClick("restart", function () { if (!running && !won) { loadLevel(); } });
  onClick("back", function () { if (!running && !won) { stopTimer(); byId("game").hidden = true; byId("welcome").hidden = false; } });
  onClick("next", function () { if (won) { levelIndex = (levelIndex + 1) % BeeGame.levels[mode].length; loadLevel(); } });
  onClick("same", function () { if (won) { loadLevel(); } });
  onClick("program", function (event) {
    if (running || won) { return; }
    var target = event.target, index;
    while (target && target !== byId("program")) {
      if (target.getAttribute && target.getAttribute("data-index") !== null) {
        index = Number(target.getAttribute("data-index")); editReady(); commands.splice(index, 1); renderProgram(); return;
      }
      target = target.parentNode;
    }
  });
}());
</script>
